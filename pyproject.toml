[project]
name = "bellwether"
version = "0.1.0"
description = "股票分析与规划 AI Agent（研究辅助工具，非投资建议）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
]

# 注：pandas-ta（技术指标）等 P1 才需要的依赖，等 P1 阶段再加入，
# 避免 P0 骨架的安装被无关依赖拖累。

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cn = ["akshare"]  # A股/港股数据源（可选，仅分析 A股/港股需要）

[project.scripts]
bellwether = "bellwether.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bellwether"]
