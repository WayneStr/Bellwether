[project]
name = "bellwether"
version = "0.1.0"
description = "股票分析与规划 AI Agent（研究辅助工具，非投资建议）"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "WayneStr", email = "43822696+WayneStr@users.noreply.github.com" }]
keywords = ["stock", "analysis", "agent", "llm", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
]

# 注：pandas-ta（技术指标）等 P1 才需要的依赖，等 P1 阶段再加入，
# 避免 P0 骨架的安装被无关依赖拖累。

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    # numpy>=2.3 的打包 stub 用 PEP 695 `type` 语法（须 3.12+ 语法解析），与本项目
    # mypy python_version=3.11 基线冲突；numpy 只是 pandas 的间接依赖，仅类型检查环境需要此上限。
    "numpy<2.3",
]
cn = ["akshare"]  # A股/港股数据源（可选，仅分析 A股/港股需要）

[project.scripts]
bellwether = "bellwether.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellwether"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["bellwether.agent.*", "bellwether.config", "bellwether.models", "bellwether.snapshot"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["bellwether.data.*", "bellwether.analysis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["akshare.*", "yfinance.*", "pandas", "pandas.*"]
ignore_missing_imports = true
