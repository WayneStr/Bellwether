name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-extras：akshare（cn）不装会让 9 个测试 skip，覆盖率虚低于本地
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check src tests

      - name: mypy
        run: uv run mypy src

      - name: pytest
        # 覆盖率门槛 85：M1 收尾补齐 CLI/provider 测例后实测 ~92%（详见 scripts/ci-local.sh 注释）。
        run: uv run pytest --cov=bellwether --cov-fail-under=85
